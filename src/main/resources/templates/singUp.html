<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1" name="viewport" />
	<title>Register Page</title>
	<link rel="stylesheet" type="text/css" href="../../css/singUp.css">

	<!--	<link rel="stylesheet" type="text/css" href="../../css/singUp.css">  for java-->
	<!-- <link rel="stylesheet" type="text/css" href="../static/css/singUp.css">  for vs code -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

	<div class="main-page">
		<div class="main">

			<div class="header-text">
				<h2 class="header-title">School Chat</h2>

			</div>


			<div class="reg-form">

				<form method="post" action="/register" th:action="@{/register}" th:object="${registerRequest}"
					class="register-form" id="register">

					<h2 class="form-title">Register to </h2>
					<h5 class="school__name" th:text="${userCurrentSchoolModel.name}"></h5>
					<div class="form__message  "></div>

					<!--					Save current School id and request in usersModel -->
					<input type="hidden" id="schoolId" th:value="${userCurrentSchoolModel.id}" th:field="*{schoolId}">


					<div class="user-nickname ">
						<input type="text" id="username" th:field="*{login}" autofocus placeholder="Your nickname"
							class="form__input " required pattern="[A-Za-z0-9_.]+">

						<div class="form__input-error-message  "></div>
						<div class="form__input-error-message-username  "></div>
					</div>



					<div class="user-email">

						<input type="email" id="email" th:field="*{email}" autofocus placeholder="Email" class="form__input"
							required>

					</div>

					<div class="user-password">
						<input type="password" id="password" th:field="*{password}" placeholder="Password" class="form__input"
							required>

						<div class="form__input-error-message "></div>
					</div>

					<div class="user-confirm-password">
						<input type="password" id="confirm-password" placeholder="Confirm Password" class="form__input"
							required>


						<div class="form__input-error-message "></div>

					</div>
					<!-- <div class="container unauthenticated">
						With GitHub: <a th:href="@{/oauth2/authorization/github}">click here</a>
						With Google: <a th:href="@{/oauth2/authorization/google}">click here</a>
					</div> -->

					<div class="reg-submit">
						<input type="submit" value="Register" name="submit" id="reg-form-submit">

					</div>


					<div class="footer-text">
						<p style="margin-bottom:4px;">Have an Account? <a href="/login">Login Here</a></p>
						<p>Back to search school --> <a href="/">Search School</a></p>
					</div>

				</form>



			</div><!-- /reg-form-->

		</div><!-- /main-->
	</div><!-- /main-page-->
	<script src="../../js/scripts.js"></script>
	<!-- <script src="../../js/scripts.js"></script>-->
	<script src="../../js/Bibliothek/jquery-3.7.1.min.js"></script>
	<script src="../../js/validationRegPage/validationRegLoginPage.js"></script>
	<!-- <script src="../static/js/validationRegPage/validationRegLoginPage.js"></script>   for vs code-->
	<!-- <script src="../../js/validationRegPage/validationRegLoginPage.js"></script>   for java-->
	<script>
		$(document).ready(function () {




			let previousWords = [];

			$('#username').on('input', function () {
				$(this).val($(this).val().replace(/[^A-Za-z0-9_.]/g, ''));

				const username = $(this).val();
				//console.log("Input text:", username);

				$.ajax({
					url: '/checkUsername',
					type: 'POST',
					data: { username: username }, // sending as form param
					success: function (response) {
						if (response) {
							$('.form__input-error-message-username')
								.text('Username is available')
								.css('color', 'green');
							$("#reg-form-submit").prop('disabled', false);
						} else {
							$('.form__input-error-message-username')
								.text('Username is already taken')
								.css('color', 'red');
							$("#reg-form-submit").prop('disabled', true);
						}
					},
					error: function () {
						$('.form__input-error-message-username')
							.text('Error checking username')
							.css('color', 'red');
						$("#reg-form-submit").prop('disabled', true);
					}
				});



			});
		});



	</script>
	<noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
