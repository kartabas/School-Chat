<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1" name="viewport" />
	<title>Register Page</title>
	<link rel="stylesheet" type="text/css" href="../../css/singUP.css">

	<!--	<link rel="stylesheet" type="text/css" href="../../css/singUP.css">  for java-->
	<!-- <link rel="stylesheet" type="text/css" href="../static/css/singUP.css">  for vs code -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

	<div class="main-page">
		<div class="main">

			<div class="header-text">
				<h2 class="header-title">School Chat</h2>
				<h5> <span th:text="${userSchool}"></span></h5>
			</div>


			<div class="reg-form">




				<form method="post" action="/" th:action="@{/}" th:object="${registerRequest}"
					class="register-form" id="register">

					<h2 class="form-title">Register</h2>

					<div class="form__message  "></div>

					<div class="user-nickname ">
						<input type="text" id="username" th:field="*{login}" autofocus placeholder="Your nickname"
							class="form__input " required>

						<div class="form__input-error-message  "></div>

					</div>



					<div class="user-email">

						<input type="email" id="email" th:field="*{email}" autofocus placeholder="Email" class="form__input" required>

					</div>

					<div class="user-password">
						<input type="password"  id="password"
							th:field="*{password}" placeholder="Password" class="form__input"  required>

						<div class="form__input-error-message "></div>
					</div>

					<div class="user-confirm-password">
						<input type="password" 
							id="confirm-password" placeholder="Confirm Password" class="form__input" required >
					

						<div class="form__input-error-message "></div>

					</div>


					<div class="reg-submit">
						<input type="submit" value="Register"  name="submit" id="reg-form-submit">

					</div>


					<div class="footer-text">
						<p>Have an Account? <a href="/login">Login Here</a></p>
						<!--<p>Have an Account? <a href="/login">Login Here</a></p>  for java-->
						<!-- <p>Have an Account? <a href="../templates/Login.html">Login Here</a> </p>  for vs code -->
					</div>

				</form>



			</div><!-- /reg-form-->

		</div><!-- /main-->
	</div><!-- /main-page-->

	<script src="../../js/validationRegPage/validationRegLoginPage.js"></script>
	<!-- <script src="../static/js/validationRegPage/validationRegLoginPage.js"></script>   for vs code-->
	<!-- <script src="../../js/validationRegPage/validationRegLoginPage.js"></script>   for java-->

	<noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
