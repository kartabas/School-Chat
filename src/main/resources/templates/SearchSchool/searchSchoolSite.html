<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="data:;base64,iVBORwOKGO=" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="../../css/searchPage.css">
	<!-- <link rel="stylesheet" type="text/css" href="../../static/css/searchPage.css"> -->
	<title>Search School</title>

</head>

<body>

	<div class="header">
		<div class="logo">Welcome to Student Chat</div>
	</div>


	<div class="main">

		<div class="search-wrapper ">
			<div class="select__search">
				<div class="search__img"><img src="../../fotos/search.svg" alt="search"></div>
				<form id="searchForm" action="/" th:action="@{/}" th:object="${searchSchoolRequest}" method="post" autocomplete="off">

					<input id="searchSchool" class="searchSchool" type="text"
						placeholder="Search school by name or postal code or city" th:field="*{name}" autocomplete="off" required>

					<button id="searchButton" type="submit"><img src="../../fotos/submit.png" alt="submit"></button>

				</form>

			</div>

			<form id="schoolForm" action="/app" th:action="@{/app}" method="post" th:object="${schoolData}" >
				<div id="searchResult" class="search_school">
					<div class="noFound"></div>

					<div th:each="school, iterStat : ${schools} "  class="json__object"  >

						<div class="name" th:text=" ${school.name}" ></div>
						<div class="address" th:text=" ${school.address}"></div>




					</div>
				</div>
				<input id="currentSchool" type="hidden" name="currentSchool"  th:value="${schoolData}"/>
<!--				<input id="currentSchool" type="hidden" name="currentSchool"-->
<!--					   th:value="${schoolData.official_id + ',' + schoolData.id + ',' + schoolData.name + ',' + schoolData.schoolType + ',' + schoolData.address + ',' + schoolData.fullTimeSchool + ',' + schoolData.state + ',' + schoolData.phone + ',' + schoolData.fax + ',' + schoolData.latitude + ',' + schoolData.longitude}"/>-->

			</form>








			</div>






		</div>
	</div>


	</div>



	<div class="footer">

	</div>



	<!-- 	For java-->
	<script src="../../js/Bibliothek/jquery-3.7.1.min.js"></script>
	<script src="../../js/searchScoolSeite/searchSchool.js"  ></script>

	<script th:inline="javascript">
	/*<![CDATA[*/
		let arrayID = [];
		let Schools = [[${schools}]];


		if(Schools != null){
			Schools.forEach(school => {
				arrayID.push(school.id);

    		});
		}else{
			arrayID = null ;
		}


	/*]]>*/
	</script>

	<noscript>You need to enable JavaScript to run this app.</noscript>

	<!-- For vs code -->
	<!-- <script src="../../static/js/Bibliothek/jquery-3.7.1.min.js"></script>
	<script src="../../static/js/searchScoolSeite/searchSchool.js"></script> -->
</body>

</html>
